<!-- sarah, si tu lis ça c'est que tu fouilles dans mon code 👀 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040404">
<meta name="description" content="pas de fleuriste ouvert à 2h du mat… alors je t'en ai codé un.">
<meta property="og:title" content="Sarah, j'ai un petit truc pour toi ♥">
<meta property="og:description" content="ouvre-le ♥">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<title>Pour Sarah ♥</title>
<link rel="preload" href="fonts/jetbrains-mono-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/shadows-into-light-two-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
/* polices : jetbrains mono (mon éditeur) + une écriture à la main */
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"JetBrains Mono";font-weight:700;font-display:swap;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";font-weight:700;font-display:swap;src:url(fonts/jetbrains-mono-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Main";font-weight:400;font-display:swap;src:url(fonts/shadows-into-light-two-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Main";font-weight:400;font-display:swap;src:url(fonts/shadows-into-light-two-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --bg:#040404; --ink:#ebe5d8; --muted:#8a8478; --dim:#55514a; --line:#262523;
  --pink:#f06b8a; --rose:#f6a3b6; --gold:#f1c53f;
  --cmt:#6a9955;   /* le vert des commentaires dans vs code */
  --ok:#89d185;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --hand:"Main","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:400 14px/1.55 var(--mono);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:1px dashed var(--rose);outline-offset:4px}
.cmt{color:var(--cmt)}
.hand{font-family:var(--hand);font-weight:400}
.emo{white-space:nowrap;font-family:system-ui,sans-serif}
/* le curseur qui clignote */
.cur{display:inline-block;width:.58em;height:1.15em;margin-left:1px;vertical-align:-.2em;background:var(--pink);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* texte tapé : le "fantôme" réserve la place pour que rien ne bouge */
.tl{display:grid}
.tl > *{grid-area:1/1}
.ghost{visibility:hidden}

/* ---- écran d'accueil ---- */
.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding-top:var(--nb,38vh);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  transition:opacity .9s}
.intro.gone{opacity:0;pointer-events:none}
.intro .cmt{margin:0;font-size:13px;opacity:0;transition:opacity 1s}
.intro .hi{margin:clamp(14px,3.2vh,30px) 0 0;font-size:clamp(60px,17vw,104px);line-height:1;color:var(--rose);
  transform:rotate(-4deg);clip-path:inset(-30% 100% -30% 0);transition:clip-path 1.5s cubic-bezier(.55,0,.35,1)}
.intro .say{margin:6px 0 0;font-size:clamp(14px,3.9vw,17px);min-height:1.6em}
.intro.s1 .cmt{opacity:1}
.intro.s2 .hi{clip-path:inset(-30% -10% -30% -10%)}
.key{margin-top:clamp(24px,4.6vh,40px);padding:11px 22px 9px;background:#111;border:1px solid #2f2d2a;border-bottom-width:4px;border-radius:10px;
  font-weight:700;font-size:15px;color:var(--ink);opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s,border-color .2s}
.key.on{opacity:1;transform:none}
.key:hover{border-color:var(--pink)}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key i{font-style:normal;color:var(--pink);margin-left:6px}
.sig{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin:0;font-size:11px;color:var(--dim)}

/* ---- pendant que le bouquet pousse ---- */
.term{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 24px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);
  margin:0;text-align:left;pointer-events:none;font-size:clamp(13px,3.6vw,16px);line-height:1.65;opacity:0;transition:opacity .5s}
.term.show{opacity:1}
.term .p{color:var(--pink)}
.term .l2{color:var(--rose)}

/* ---- le message sous son prénom ---- */
.fin{position:fixed;left:0;right:0;margin:0;text-align:center;pointer-events:none;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.fin .big{display:inline-block;font-family:var(--hand);font-size:clamp(36px,10vw,58px);line-height:1.05;color:var(--rose);text-shadow:0 0 22px rgba(240,107,138,.35);
  transform:rotate(-2.5deg);clip-path:inset(-40% 100% -40% 0);transition:clip-path 1.7s cubic-bezier(.55,0,.35,1)}
.fin.show .big{clip-path:inset(-40% -5% -40% -5%)}
.fin .sm{display:block;margin-top:12px;font-size:clamp(13px,3.6vw,16px);line-height:1.65;opacity:0;transition:opacity 1s .2s}
.fin.show .sm{opacity:1;transition-delay:1.5s}
.fin .tap{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-family:var(--hand);font-size:clamp(21px,5.6vw,27px);color:var(--ink);
  opacity:0;transform:rotate(-1.5deg);transition:opacity 1s}
.fin.show .tap{opacity:.95;transition-delay:2.8s;animation:breathe 3s ease-in-out 4s infinite}
.fin .tap svg{width:1.1em;height:1.1em;flex:none}
@keyframes breathe{50%{opacity:.4}}
.again{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:7px 11px;background:rgba(4,4,4,.7);border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--muted);
  opacity:0;pointer-events:none;transition:opacity 1.2s,color .2s,border-color .2s}
.again.show{opacity:1;pointer-events:auto}
.again:hover{color:var(--ink);border-color:var(--dim)}
@media (prefers-reduced-motion: reduce){
  .cur{animation:none}.intro .hi,.fin .big{clip-path:none!important;transition:none}
  .intro .cmt,.key,.fin .sm,.fin .tap,.term,.intro{transition:none}.fin .tap{animation:none}
}

/* ---- la surprise du jour : la carte + la photo ---- */
.mem{position:fixed;inset:0;z-index:5;opacity:0;transition:opacity 1.6s ease;background:var(--bg)}
.mem.on{opacity:1}
#map{position:absolute;inset:0;background:#040404}
.vig{position:absolute;inset:0;pointer-events:none;z-index:401;background:linear-gradient(180deg,rgba(4,4,4,.93) 0,rgba(4,4,4,.72) 140px,rgba(4,4,4,0) 230px),radial-gradient(ellipse at 50% 32%,rgba(4,4,4,0) 30%,rgba(4,4,4,.88) 100%)}
.memtop{position:absolute;z-index:402;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);text-align:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));opacity:0;transition:opacity 1.2s}
.memtop.on{opacity:1}
.memtop .cmt{font-size:12px}
.memtop .hand{display:block;margin-top:2px;font-size:clamp(23px,6vw,31px);line-height:1.1;transform:rotate(-1.5deg)}
.pola{position:absolute;z-index:403;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(70vw,320px,calc((100vh - 260px) * .64));margin:0;padding:10px 10px 0;
  background:#f6f2e8;border-radius:2px;box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.08);cursor:zoom-in;
  transform:translate(-50%,130%) rotate(-7deg);opacity:0;transition:transform 1.5s cubic-bezier(.2,.9,.25,1.12),opacity 1s}
.pola.on{transform:translate(-50%,0) rotate(-3deg);opacity:1}
/* un bout de scotch de masquage */
.pola::before{content:"";position:absolute;top:-13px;left:50%;width:98px;height:28px;transform:translateX(-50%) rotate(4deg);background:rgba(231,219,188,.86);
  box-shadow:0 1px 2px rgba(0,0,0,.18);clip-path:polygon(3% 0,97% 0,100% 18%,96% 34%,100% 52%,97% 70%,100% 86%,97% 100%,3% 100%,0 84%,4% 66%,0 49%,3% 31%,0 14%)}
.pola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9d3c7;transition:opacity .6s}
.pola img.fade{opacity:0}
.pola figcaption{font:400 clamp(23px,6.2vw,29px)/1 var(--hand);color:#29241f;text-align:center;padding:10px 4px 13px}
.pin{width:18px;height:18px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 4px rgba(240,107,138,.35),0 0 24px 6px rgba(240,107,138,.6);animation:pin 2s ease-out infinite}
@keyframes pin{0%{box-shadow:0 0 0 0 rgba(240,107,138,.6),0 0 24px 6px rgba(240,107,138,.6)}100%{box-shadow:0 0 0 22px rgba(240,107,138,0),0 0 24px 6px rgba(240,107,138,.6)}}
.past{width:9px;height:9px;border-radius:50%;background:#f6d6de;opacity:.75;box-shadow:0 0 10px rgba(246,214,222,.6)}
.leaflet-container{background:#040404;font-family:var(--mono)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.45)}
.leaflet-control-attribution{background:rgba(4,4,4,.55)!important;color:#6d685c!important;font-size:8px!important}
.leaflet-control-attribution a{color:#8a8578!important}
.tiny{position:absolute;z-index:403;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);pointer-events:none;
  font:400 19px/1 var(--hand);color:var(--muted);transform:rotate(-3deg);opacity:0;transition:opacity 1.2s}
.tiny.on{opacity:1}
.lb{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,4,4,.94);opacity:0;pointer-events:none;transition:opacity .45s;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.lb.on{opacity:1;pointer-events:auto;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.7);transform:scale(.94);transition:transform .45s cubic-bezier(.2,.9,.25,1.1)}
.lb.on img{transform:none}
.mem{transition:opacity 1.6s ease,background-color 3.2s ease}
#map,.vig{transition:opacity 3.2s ease}
.mem.fading{background-color:transparent}
.mem.fading #map,.mem.fading .vig{opacity:0}
body.finale .fin,body.finale .term{visibility:hidden}
/* le final du 11 */
.finale{position:absolute;z-index:405;left:0;right:0;top:var(--fy,52vh);margin:0;text-align:center;pointer-events:none;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.finale .cmt{margin:0;font-size:12px;opacity:0;transition:opacity 1s}
.finale.on .cmt{opacity:1}
.fbig{margin:4px auto 0;max-width:12em;font-size:clamp(36px,10vw,60px);line-height:1.02;color:var(--rose);text-shadow:0 0 22px rgba(240,107,138,.35);text-wrap:balance;
  transform:rotate(-2deg);clip-path:inset(-40% 100% -40% 0);transition:clip-path 2.2s cubic-bezier(.55,0,.35,1)}
.finale.on .fbig{clip-path:inset(-40% -6% -40% -6%)}
.flines{width:max-content;max-width:100%;margin:16px auto 0;text-align:left;font-size:clamp(13px,3.6vw,16px);line-height:1.75}
.flines .p{color:var(--pink)}
.again2{margin-top:24px;padding:9px 15px;background:rgba(4,4,4,.6);border:1px solid var(--pink);border-radius:7px;color:var(--rose);font-size:13px;
  opacity:0;transform:translateY(6px);transition:opacity .9s,transform .9s,background-color .2s;pointer-events:none}
.again2.on{opacity:1;transform:none;pointer-events:auto}
.again2:hover{background:#2a1a20}
@media (prefers-reduced-motion: reduce){.fbig{clip-path:none!important;transition:none}.mem,#map,.vig,.again2,.finale .cmt{transition:none}}
.fh{position:fixed;z-index:15;pointer-events:none;font-size:26px;color:var(--pink);text-shadow:0 0 14px rgba(240,107,138,.6);animation:fh 1.6s ease-out forwards}
@keyframes fh{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-260%) scale(.9)}}

/* ---- la question du 1er novembre, dans un petit terminal ---- */
.askbtn{position:absolute;z-index:404;left:50%;top:calc(env(safe-area-inset-top,0px) + 124px);transform:translate(-50%,-6px);opacity:0;pointer-events:none;
  transition:opacity 1s,transform 1s,border-color .2s;padding:8px 13px;background:rgba(12,12,12,.9);border:1px solid #3b2a30;border-radius:8px;font-size:13px;color:var(--rose);white-space:nowrap}
.askbtn.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.askbtn:hover{border-color:var(--pink)}
.askbtn b{font-weight:400;color:var(--pink)}
.ask{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(4,4,4,.82);opacity:0;pointer-events:none;transition:opacity .4s;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.ask.on{opacity:1;pointer-events:auto}
.ask:not(.on) *{pointer-events:none!important}
.win{box-sizing:border-box;width:min(100%,440px);min-width:0;background:#0d0d0d;border:1px solid #2b2b2b;border-radius:11px;box-shadow:0 30px 80px rgba(0,0,0,.75);overflow:hidden;text-align:left;
  transform:translateY(10px) scale(.98);transition:transform .4s cubic-bezier(.2,.9,.25,1.1)}
.ask.on .win{transform:none}
.bar{display:flex;align-items:center;gap:7px;padding:10px 12px;background:#171717;border-bottom:1px solid #242424}
.dot{width:11px;height:11px;padding:0;border:0;border-radius:50%;flex:none}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.bar span{flex:1;text-align:center;margin-right:43px;font-size:11px;color:#8b8b8b}
.wbody{padding:16px 14px 16px}
.wbody .cmt{margin:0;font-size:12px}
.wbody h2{margin:4px 0 12px;font:400 15px/1.5 var(--mono);color:var(--ink)}
.opts{display:grid;gap:3px}
.opt{display:grid;grid-template-columns:20px 1fr;gap:8px;width:100%;text-align:left;padding:9px 8px;border:0;border-radius:5px;background:transparent;font-size:14px;line-height:1.45;color:var(--ink)}
.opt b{font-weight:400;color:var(--dim)}
.opt:hover,.opt:focus-visible{background:#1c1316;outline:none}
.opt:hover b,.opt:focus-visible b{color:var(--pink)}
.opt.sel{background:#2a1a20}
.opt.sel b{color:var(--pink)}
.done{display:none}
.win.answered .opts{display:none}
.win.answered .done{display:block}
.done p{margin:0 0 2px;font-size:14px}
.done .ok{color:var(--ok)}
.send{margin-top:14px;padding:9px 14px;background:transparent;border:1px solid var(--pink);border-radius:7px;color:var(--rose);font-size:13px}
.send:hover{background:#2a1a20}
.close{display:inline-block;margin-top:14px;padding:0;background:none;border:0;font-size:12px;color:var(--muted)}
.close:hover{color:var(--ink)}
</style>
</head>
<body>

<canvas id="c" aria-label="Un bouquet de fleurs dessiné en caractères"></canvas>

<p class="term" id="line1" aria-live="polite">
  <span class="tl"><span class="ghost" id="t1g"></span><span class="typed" id="t1"></span></span>
  <span class="tl l2"><span class="ghost" id="t2g"></span><span class="typed" id="t2"></span></span>
</p>

<p class="fin" id="line2">
  <span class="big" id="bday"></span>
  <span class="sm" id="sm"></span>
  <span class="tap">touche l'écran mon amour
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27.5c-3.2-2.6-11.4-8.2-11.7-14.3C4.1 8.6 7.4 5.6 10.9 6c2.4.3 4.1 2.1 5 4.3.8-2.4 2.6-4.5 5.3-4.7 3.6-.3 6.6 2.9 6.2 6.9-.5 5.8-7.6 11.3-11.2 14.9" fill="none" stroke="#f06b8a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>
</p>

<div class="mem" id="mem" hidden>
  <div id="map" aria-label="La carte du jour"></div>
  <div class="vig"></div>
  <div class="memtop" id="memtop"></div>
  <div class="tiny" id="tiny">(touche la photo)</div>
  <figure class="pola" id="pola"><img id="polaimg" alt="Nous deux"><figcaption id="polacap"></figcaption></figure>
  <div class="finale" id="finale" hidden>
    <p class="cmt">// 11.11</p>
    <p class="fbig hand" id="fbig"></p>
    <div class="flines" id="flines"></div>
    <button class="again2" id="again2" type="button">↻ revoir nos souvenirs</button>
  </div>
</div>

<button class="askbtn" id="askbtn" type="button"><b>&gt;</b> une dernière question<span class="cur"></span></button>
<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askq">
  <div class="win" id="win">
    <div class="bar"><button class="dot r" id="x" type="button" aria-label="Fermer"></button><i class="dot y"></i><i class="dot g"></i><span>question.js</span></div>
    <div class="wbody">
      <p class="cmt">// pour le 11 novembre</p>
      <h2 id="askq">ce soir-là, tu rêverais plutôt de…</h2>
      <div class="opts">
        <button class="opt" type="button"><b>1</b><span>une table secrète, au cœur de la cuisine des chefs</span></button>
        <button class="opt" type="button"><b>2</b><span>un lieu mythique, chic et un peu hors du temps</span></button>
        <button class="opt" type="button"><b>3</b><span>une expérience originale qui me surprend</span></button>
      </div>
      <div class="done">
        <p class="ok">&gt; réponse enregistrée ✓</p>
        <p class="cmt">// je te dis rien de plus 🤫</p>

<script>
(() => {

const C = {

// les fleurs : x, y (y vers le haut = négatif), taille, couleur, inclinaison, rotation
const LILIES = [
  [ 0.00,-0.52,0.16,C.red,1, .2],   [-0.27,-0.43,0.15,C.white,.9,1.0], [ 0.28,-0.41,0.15,C.yellow,.9,-.3],
  [-0.34,-0.13,0.15,C.gold,.9,.5],  [ 0.33,-0.12,0.15,C.plum,.9,1.3],  [ 0.00,-0.22,0.17,C.magenta,1,.8],
  [-0.16, 0.09,0.17,C.white,1,.4],  [ 0.18, 0.08,0.17,C.peach,1,.9],
  [-0.38, 0.23,0.12,C.yellow,.85,1.2], [ 0.38, 0.21,0.12,C.crimson,.85,.7]

const BUDS = [[-0.14,-0.76,C.white],[0.14,-0.74,C.pink],[0.44,-0.56,C.yellow],[-0.45,-0.58,C.red]];

// quel jour on est ?
const fnv = s => { let h = 0x811c9dc5; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h; };
const TODAY = (() => {
  const d = new Date(), h = location.hash, m = h.match(/nov(\d{1,2})/), t = (h.match(/[#&]t=(\w+)/) || [])[1];

const BDAY = new Date(TODAY.getFullYear(), 10, 11);
const DAYS = Math.round((BDAY - new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate())) / 864e5);
const NOVDAY = TODAY.getMonth() === 10 ? TODAY.getDate() : 0;
const ISBDAY = DAYS === 0;

// un bouquet différent chaque jour
const THEMES = [
  null, // le 1er : le mélange du début
  { t:['rose','rose','lily'], p:['#ef8fb0','#f5f0e6','#f7c6d4','#e05a8a'] },          // roses roses & blanches
  { t:['tulip','tulip','tulip','lily'], p:['#f2843a','#f6d23a','#e3242b','#f3ab82'] }, // tulipes coucher de soleil
  { t:['lily','lily','rose'], p:['#f5f0e6','#c9b6f2','#9d7fe0','#efe3ff'] },          // blanc & lavande
  { t:['rose','lily'], p:['#d81c2c','#f5f0e6','#a30f22'] },                           // classique rouge & blanc
  { t:['tulip','tulip','rose'], p:['#f7c6d4','#fbe3a0','#c9b6f2','#bfe6c8','#f5f0e6'] }, // pastel
  { t:['lily','lily','tulip'], p:['#cf3fcc','#e9a526','#f4cb2e','#a52a78'] },         // magenta & or
  { t:['rose','tulip','lily'], p:['#7a5cf0','#b48cf5','#5d3fd3','#f5f0e6'] },         // violets
  { t:['lily','tulip','rose'], p:['#f4cb2e','#f5f0e6','#ffe27a','#f2b33a'] },         // soleil
  { t:['rose','rose','tulip'], p:['#a30f22','#ef8fb0','#d81c2c','#f7c6d4'] },         // pourpre & rose
  { t:['lily','rose','tulip'], p:['#e3242b','#f5f0e6','#f4cb2e','#cf3fcc','#f3ab82','#ef8fb0','#7a5cf0','#f2843a'] } // le jour J
];
const dayKey = TODAY.getFullYear() * 400 + TODAY.getMonth() * 32 + TODAY.getDate();
const THEME = NOVDAY >= 1 && NOVDAY <= 11 ? THEMES[NOVDAY - 1] : THEMES[1 + dayKey % 10];

let seed = NOVDAY === 1 ? 11 : 11 + dayKey % 9973; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pick = a => a[(rnd() * a.length) | 0];
const TYPES = THEME ? Object.fromEntries(LILIES.map((_, i) => [i, [pick(THEME.t), pick(THEME.p)]]))
  : { 0:['rose','#d81c2c'], 3:['tulip','#f2843a'], 7:['rose','#ef8fb0'], 8:['tulip','#f6d23a'], 9:['rose','#a30f22'], 4:['tulip','#d64a9a'] };
if (THEME) BUDS.forEach(b => { b[2] = pick(THEME.p); });
const flowers = LILIES.map((f, i) => ({
  x:f[0], y:f[1], r:f[2], tilt:f[4], spin:f[5], view:(rnd()-.5)*1.2, i,
  type: TYPES[i] ? TYPES[i][0] : 'lily', col: TYPES[i] ? TYPES[i][1] : f[3],
  bend:(rnd()-.5)*.14, leaves:[[.3+rnd()*.25, rnd()<.5?-1:1],[.55+rnd()*.2, rnd()<.5?-1:1]].slice(0, rnd()<.6?2:1),
  spots:Array.from({length:9},()=>[rnd()*2-1, .12+rnd()*.35])
}));
const buds = BUDS.map((b, i) => ({ x:b[0], y:b[1], col:b[2], i:i+20, bend:(rnd()-.5)*.1, ang:(b[0])*1.2 }));
const blades = Array.from({ length: 18 }, (_, i) => ({ a:(i/17-.5)*2.6 + (rnd()-.5)*.2, l:.16+rnd()*.16, w:.022+rnd()*.012, c:rnd() }));

// le gros chiffre du compte à rebours, dessiné en caractères lui aussi
const BIG = ISBDAY ? '11.11' : DAYS > 0 && DAYS <= 10 ? 'J-' + DAYS : '<3';
let bigY = 0, bigSize = 100, heartR = 100, heartY = 200, finConf = false;
// le grand cœur de la fin (la vraie équation d'un cœur, oui oui)
function bigHeart(t) {
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, cols, rows);
  o.setTransform(1 / cw, 0, 0, 1 / ch, 0, 0);
  const beat = reduce ? 0 : Math.pow(Math.max(0, Math.sin(t * 2.5)), 8) * .07 + Math.pow(Math.max(0, Math.sin(t * 2.5 - .55)), 10) * .035;
  const s = (reduce ? 1 : back(t / 1.8)) * (1 + beat), R = heartR / 16;
  if (s <= 0) return;
  o.save(); o.translate(W / 2, heartY); o.scale(s, s);
  o.beginPath();
  for (let k = 0; k <= 160; k++) {
    const a = k / 160 * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(a), 3), y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
    k ? o.lineTo(x * R, y * R) : o.moveTo(x * R, y * R);
  }
  o.closePath();
  const gr = o.createRadialGradient(-heartR * .32, -heartR * .3, heartR * .04, 0, 0, heartR * 1.25);
  gr.addColorStop(0, '#ffd3dd'); gr.addColorStop(.3, '#f88aa4'); gr.addColorStop(.7, '#e3284f'); gr.addColorStop(1, '#a30f2b');
  o.fillStyle = gr; o.fill();
  o.restore();
}
// au chargement, les chiffres défilent avant de se poser (comme un code qui se déchiffre)
function bigText(time) {
  if (reduce || time > 2) return BIG;
  return Array.from(BIG).map((c, i) => /\d/.test(c) && time < .55 + i * .2 ? String((Math.floor(time * 16) * 7 + i * 3) % 10) : c).join('');
}
function drawBig(alpha, reveal, time = 9) {
  if (alpha <= 0) return;
  o.save();
  o.globalAlpha = alpha;
  o.font = `700 ${bigSize}px "JetBrains Mono", ui-monospace, monospace`;
  o.textAlign = 'center'; o.textBaseline = 'middle';
  const gr = o.createLinearGradient(0, bigY - bigSize * .4, 0, bigY + bigSize * .4);
  gr.addColorStop(0, '#ffe9a8'); gr.addColorStop(.5, '#f1c53f'); gr.addColorStop(1, '#f06b8a');
  o.fillStyle = gr;
  o.beginPath(); o.rect(0, 0, W * reveal, H); o.clip();
  o.fillText(bigText(time), W / 2, bigY);
  o.restore();
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ch = W < 600 ? 4.6 : 6; cw = ch * 0.6;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  off.width = cols; off.height = rows;
  glow.width = Math.ceil(cols / 1.6); glow.height = Math.ceil(rows / 1.6);
  const top = W < 600 ? 150 : 150;
  S = Math.min((H - top - 40) / 1.45, W / 1.02);
  ox = W / 2; baseX = ox; baseY = H - Math.max(30, H * .05);
  oy = Math.min(top + 0.95 * S, baseY - 0.5 * S);
  font = `700 ${ch}px ${getComputedStyle(document.documentElement).getPropertyValue('--mono')}`;
  stars = Array.from({ length: Math.round(cols * rows / 160) }, () => ({
    c:(Math.random()*cols)|0, r:(Math.random()*rows)|0, p:Math.random()*6.28, s:.4+Math.random()*1.6
  }));
  layoutName();
  bigSize = Math.min(W * .86 / (BIG.length * .6), H * .19);
  bigY = H * .25;
  heartR = Math.min(W * .3, H * .17); heartY = H * .28;
  document.documentElement.style.setProperty('--fy', Math.round(heartY + heartR * 1.2 + 12) + 'px');
  document.documentElement.style.setProperty('--nb', Math.round(bigY + bigSize * .42 + 8) + 'px');
}
const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const P = (x, y) => [ox + x * S, oy + y * S];
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function mix(hex, k, to) {
  const a = rgb(hex), b = to ? rgb(to) : (k < 0 ? [0,0,0] : [255,255,255]), t = Math.abs(k);
  return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * t)).join(',')})`;
}

function stemPath(f, time) {
  const sway = Math.sin(time * 0.7 + f.i * 1.7) * S * 0.006;
  const bx = baseX + f.x * S * 0.16, by = baseY;
  const [ex, ey] = P(f.x, f.y);
  return { bx, by, qx: (bx + ex) / 2 + f.bend * S, qy: by - (by - ey) * .55, ex: ex + sway, ey };
}
const qpt = (p, u) => [
  (1-u)*(1-u)*p.bx + 2*(1-u)*u*p.qx + u*u*p.ex,
  (1-u)*(1-u)*p.by + 2*(1-u)*u*p.qy + u*u*p.ey
];

function leaf(x, y, ang, len, wid, col) {
  if (len < 1) return;
  o.save(); o.translate(x, y); o.rotate(ang);
  const gr = o.createLinearGradient(0, 0, len, 0);
  gr.addColorStop(0, mix(col, -.35)); gr.addColorStop(.5, col); gr.addColorStop(1, mix(col, .25));
  o.beginPath(); o.moveTo(0, 0);
  o.bezierCurveTo(len*.3, -wid, len*.7, -wid*.8, len, wid*.15);
  o.bezierCurveTo(len*.7, wid*.6, len*.3, wid*.7, 0, 0);
  o.fillStyle = gr; o.fill();
  o.strokeStyle = '#040404'; o.lineWidth = Math.max(cw * .9, wid * .1); o.stroke();
  o.strokeStyle = mix(col, .45); o.lineWidth = Math.max(1, wid * .12);
  o.beginPath(); o.moveTo(0, 0); o.quadraticCurveTo(len*.5, -wid*.1, len*.97, wid*.12); o.stroke();
  o.restore();
}

function petal(f, L, w, curl, shadeK) {
  const base = f.col;
  const light = f.col === C.red || f.col === C.crimson || f.col === C.plum || f.col === C.magenta;
  const gr = o.createLinearGradient(0, 0, 0, -L);
  gr.addColorStop(0, mix(base, .45, '#f4f7b0'));
  gr.addColorStop(.2, mix(base, shadeK - .05));
  gr.addColorStop(.7, mix(base, shadeK + .06));
  gr.addColorStop(1, mix(base, -.1));
  o.beginPath(); o.moveTo(0, 0);
  o.bezierCurveTo(w*.9, -L*.12, w*1.25, -L*.42, w*.55, -L*.72);
  o.quadraticCurveTo(w*.15 + curl*L*.05, -L*.92, curl*L*.2, -L*1.02);
  o.quadraticCurveTo(-w*.1 + curl*L*.04, -L*.88, -w*.5, -L*.7);
  o.bezierCurveTo(-w*1.2, -L*.42, -w*.85, -L*.12, 0, 0);
  o.fillStyle = gr; o.fill();
  o.strokeStyle = '#040404'; o.lineWidth = Math.max(cw * 1.1, L * .035); o.stroke();
  // la nervure + un petit reflet
  o.lineWidth = Math.max(cw * .8, L * .022);
  o.strokeStyle = mix(base, -.55);
  o.beginPath(); o.moveTo(0, -L*.12); o.quadraticCurveTo(w*.1, -L*.55, curl*L*.15, -L*.9); o.stroke();
  o.lineWidth = Math.max(cw * .6, L * .016);
  o.strokeStyle = mix(base, .6);
  o.beginPath(); o.moveTo(w*.4, -L*.18); o.quadraticCurveTo(w*.6, -L*.45, w*.3, -L*.66); o.stroke();

  o.fillStyle = light ? 'rgb(60,8,20)' : mix(C.crimson, -.25);
  for (const [sx, sy] of f.spots.slice(0, 6)) { o.beginPath(); o.arc(sx * w * .45, -L * (sy * .7 + .08), Math.max(.8, L * .014), 0, 7); o.fill(); }
}

function rose(f, x, y, s, mul = 1, spin = 0) {
  if (s <= 0) return;
  const R = f.r * S * .78 * Math.min(s, 1.1) * mul, base = f.col;
  o.save(); o.translate(x, y); o.rotate(f.spin + spin); o.scale(1, .88 + .12 * f.tilt);
  // pétales extérieurs
  for (let k = 0; k < 5; k++) {
    const a = k * 2 * Math.PI / 5;
    o.beginPath(); o.ellipse(Math.cos(a) * R * .5, Math.sin(a) * R * .5, R * .55, R * .45, a, 0, 7);
    const gr = o.createRadialGradient(0, 0, R * .2, 0, 0, R * 1.05);
    gr.addColorStop(0, mix(base, -.35)); gr.addColorStop(.7, base); gr.addColorStop(1, mix(base, .3));
    o.fillStyle = gr; o.fill();
    o.strokeStyle = '#040404'; o.lineWidth = Math.max(cw, R * .05); o.stroke();
  }
  // le cœur
  o.beginPath(); o.arc(0, 0, R * .62, 0, 7);
  o.fillStyle = mix(base, .12); o.fill();
  o.strokeStyle = '#040404'; o.lineWidth = Math.max(cw, R * .05); o.stroke();
  // la spirale
  const turns = 2.6, steps = 60;
  o.beginPath();
  for (let k = 0; k <= steps; k++) {
    const u = k / steps, a = u * turns * 2 * Math.PI, r = R * .58 * (1 - u * .92);
    k ? o.lineTo(Math.cos(a) * r, Math.sin(a) * r) : o.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  o.strokeStyle = mix(base, -.6); o.lineWidth = Math.max(cw * .9, R * .07); o.stroke();
  o.strokeStyle = mix(base, .5); o.lineWidth = Math.max(cw * .5, R * .025);
  o.beginPath(); o.arc(-R * .12, -R * .14, R * .3, Math.PI * 1.05, Math.PI * 1.6); o.stroke();
  o.restore();
}

function tulip(f, x, y, s, mul = 1, spin = 0) {
  if (s <= 0) return;
  const L = f.r * S * 1.15 * Math.min(s, 1.1) * mul, w = L * .42, base = f.col;
  o.save(); o.translate(x, y + L * .35); o.rotate(f.view * .4 + spin);

    o.beginPath(); o.moveTo(dx - w * .55 * k, -L * .05);
    o.bezierCurveTo(dx - w * 1.05 * k, -L * .45, dx - w * .5 * k, -L * .85, dx, -L);
    o.bezierCurveTo(dx + w * .5 * k, -L * .85, dx + w * 1.05 * k, -L * .45, dx + w * .55 * k, -L * .05);
    o.quadraticCurveTo(dx, L * .1, dx - w * .55 * k, -L * .05);
    const gr = o.createLinearGradient(0, 0, 0, -L);
    gr.addColorStop(0, mix(base, -.35)); gr.addColorStop(.5, mix(base, light)); gr.addColorStop(1, mix(base, light + .2));
    o.fillStyle = gr; o.fill();
    o.strokeStyle = '#040404'; o.lineWidth = Math.max(cw, L * .03); o.stroke();
  };
  cup(-w * .45, .8, -.15); cup(w * .45, .8, -.15); cup(0, .85, .1);
  o.strokeStyle = mix(base, .55); o.lineWidth = Math.max(cw * .6, L * .02);
  o.beginPath(); o.moveTo(-w * .15, -L * .2); o.quadraticCurveTo(-w * .3, -L * .55, -w * .08, -L * .85); o.stroke();
  o.restore();
}

function flowerDraw(f, x, y, s, mul, spin) {
  if (f.type === 'rose') return rose(f, x, y, s, mul, spin);
  if (f.type === 'tulip') return tulip(f, x, y, s, mul, spin);
  return lily(f, x, y, s, mul, spin);
}

// les cœurs quand tu touches l'écran
let taps = [];
function heart(x, y, R, col) {
  o.save(); o.translate(x, y);
  o.beginPath(); o.moveTo(0, R * .35);
  o.bezierCurveTo(-R * 1.1, -R * .25, -R * .55, -R * 1.05, 0, -R * .45);
  o.bezierCurveTo(R * .55, -R * 1.05, R * 1.1, -R * .25, 0, R * .35);
  const gr = o.createRadialGradient(-R * .3, -R * .5, 0, 0, 0, R * 1.1);
  gr.addColorStop(0, mix(col, .45)); gr.addColorStop(1, col);
  o.fillStyle = gr; o.fill();
  o.restore();
}

function lily(f, x, y, s, mul = 1, spin = 0) {
  if (s <= 0) return;
  const L = f.r * S * 1.3 * s * mul, open = .35 + .65 * clamp(s);
  o.save(); o.translate(x, y); o.rotate(f.view); o.scale(1, .82 + .18 * f.tilt); o.rotate(f.spin + spin);
  // pétales du dessous puis du dessus
  for (const inner of [0, 1]) for (let k = 0; k < 3; k++) {
    o.save();
    o.rotate((k * 2 * Math.PI / 3 + (inner ? Math.PI / 3 : 0)) * open);
    petal(f, L * (inner ? .95 : 1), L * (inner ? .2 : .16), inner ? -.6 : .7, inner ? .05 : -.08);
    o.restore();
  }

  const th = o.createRadialGradient(0, 0, 0, 0, 0, L * .22);

      const a = k * Math.PI / 3 + .3, ex = Math.cos(a) * sl, ey = Math.sin(a) * sl;
      o.strokeStyle = '#040404'; o.lineWidth = Math.max(cw * 1.6, L * .05);
      o.beginPath(); o.moveTo(0, 0); o.quadraticCurveTo(ex * .5 + ey * .15, ey * .5 - ex * .15, ex, ey); o.stroke();
      o.strokeStyle = '#eef3b8'; o.lineWidth = Math.max(cw * .7, L * .02);

      o.fillStyle = '#d4571c'; o.beginPath(); o.ellipse(ex, ey, L * .055, L * .028, a, 0, 7); o.fill();
    }
    o.strokeStyle = '#a9c55a'; o.lineWidth = Math.max(1, L * .03);
    o.beginPath(); o.moveTo(0, 0); o.lineTo(sl * .3, -sl * .95); o.stroke();
    o.fillStyle = '#6f8f2e'; o.beginPath(); o.arc(sl * .3, -sl * .95, L * .045, 0, 7); o.fill();
  }
  o.restore();
}

function bud(b, x, y, s, mul = 1) {
  if (s <= 0) return;
  const L = S * .1 * s * mul, w = L * .22;
  o.save(); o.translate(x, y); o.rotate(b.ang);
  const gr = o.createLinearGradient(0, 0, 0, -L);
  gr.addColorStop(0, '#6fae3c'); gr.addColorStop(.55, mix(b.col, -.05, '#9fd36a')); gr.addColorStop(1, b.col);

  o.bezierCurveTo(w*.4, -L*.9, w*1.2, -L*.45, w*.5, 0); o.closePath();

  o.strokeStyle = 'rgba(40,70,20,.7)'; o.lineWidth = 1;
  o.beginPath(); o.moveTo(0, 0); o.lineTo(0, -L * .95); o.stroke();

    const polaTop = pola.classList.contains('on') ? pr.top : H - (pr.height + 72);
    const pinY = Math.max(110, polaTop * .58);
    const pt = map.project([p.lat, p.lon], z).add([0, H / 2 - pinY]);
    return map.unproject(pt, z);
  }
  function pin(p) {
    const icon = L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [18, 18], iconAnchor: [9, 9] });
    if (marker) marker.setLatLng([p.lat, p.lon]); else marker = L.marker([p.lat, p.lon], { icon, interactive: false }).addTo(map);
  }
  async function show(n, label, flyDur) {
    const p = meta.places[n - 1];
    const url = await photo(n);
    map.flyTo(centerFor(p, p.z), p.z, { duration: reduce ? 0 : flyDur, easeLinearity: .2 });
    later(() => {
      pin(p);
      pimg.classList.add('fade');
      later(() => { pimg.src = url; pcap.textContent = p.name; pimg.classList.remove('fade'); pola.classList.add('on'); }, 350);
      top.innerHTML = label;
      top.classList.add('on');
      later(() => tiny.classList.add('on'), 2600);
    }, reduce ? 0 : flyDur * 1000 - 300);
  }
  async function start(st) {
    started = true;
    if (!(await metaP)) return;
    ensureMap();
    mem.hidden = false;
    requestAnimationFrame(() => { mem.classList.add('on'); map.invalidateSize(); map.setView([49.4, 11], 4.25, { animate: false }); });
    later(() => { window.__bqPause = true; }, 2200);
    const order = meta.order;
    if (st.ISBDAY) {
      // le 11 : toutes les photos une par une… et après, le final
      later(() => tour(0), 1200);
    } else {
      const d = st.NOVDAY >= 1 && st.NOVDAY <= order.length ? st.NOVDAY : (st.dayKey % order.length) + 1;
      const tail = st.NOVDAY >= 1 && st.NOVDAY < order.length ? 'demain, une autre surprise t’attend…' : st.NOVDAY === order.length ? 'demain c’est ton jour ♥' : 'toi & moi';
      later(() => { drawTrail(d); show(order[d - 1], `<span class="cmt">// jour ${d}/${order.length}</span><span class="hand">${tail}</span>`, 4.5); }, 1200);
      if (st.NOVDAY === 1) later(() => askbtn.classList.add('on'), 9500);
    }
  }
  function tour(k) {
    const order = meta.order;
    if (lb.classList.contains('on') || document.hidden) return later(() => tour(k), 400); // on attend si elle regarde une photo en grand (ou si elle est partie)
    if (k >= order.length) return finale();
    drawTrail(k + 1);
    show(order[k], `<span class="cmt">// toi &amp; moi · ${k + 1}/${order.length}</span><span class="hand">on rembobine un peu… ♥</span>`, k ? 2.6 : 4.2);
    later(() => tour(k + 1), k ? 6000 : 8000);
  }
  const fz = document.getElementById('finale'), fbig = document.getElementById('fbig'), flines = document.getElementById('flines'), again2 = document.getElementById('again2');
  function finale() {
    const F = meta.finale || { big: 'joyeux anniversaire mon amour', lines: ['celles-là elles faneront pas 😙😉❤️'] };
    pola.classList.remove('on'); tiny.classList.remove('on'); top.classList.remove('on');
    // on recule : toute la carte de nos souvenirs
    later(() => {
      const pts = meta.order.map(n => [meta.places[n - 1].lat, meta.places[n - 1].lon]);
      top.innerHTML = `<span class="cmt">// nos ${meta.order.length} souvenirs</span><span class="hand">toi &amp; moi ♥</span>`;
      top.classList.add('on');
      map.flyToBounds(L.latLngBounds(pts), { paddingTopLeft: [40, 150], paddingBottomRight: [40, 70], duration: reduce ? 0 : 3.2, easeLinearity: .2 });
    }, 900);
    // puis la carte s'efface doucement…
    later(() => {
      top.classList.remove('on');
      mem.classList.add('fading'); document.body.classList.add('finale');
      window.__bqFinale = performance.now(); window.__bqPause = false;
    }, reduce ? 600 : 6800);
    // … et il reste juste ça
    later(() => {
      fbig.textContent = F.big;
      flines.innerHTML = '';
      const rows = F.lines.map(l => {
        const r = document.createElement('div'); r.className = 'tl';
        r.innerHTML = `<span class="ghost">&gt; ${l}&nbsp;</span><span class="typed"></span>`;
        flines.appendChild(r); return { el: r.lastChild, text: l };
      });
      fz.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => fz.classList.add('on')));
      const cur = Object.assign(document.createElement('span'), { className: 'cur' });
      let i = 0, c = 0;
      const tick = () => {
        if (i >= rows.length) return later(() => again2.classList.add('on'), 500);
        const chars = Array.from(rows[i].text);
        c++;
        rows[i].el.innerHTML = '<span class="p">&gt;</span> ';
        rows[i].el.append(chars.slice(0, c).join('')); rows[i].el.appendChild(cur);
        if (c >= chars.length) { i++; c = 0; later(tick, i < rows.length ? 600 : 300); } else later(tick, 34 + Math.random() * 34);
      };
      later(tick, reduce ? 0 : 2000);
    }, reduce ? 900 : 9300);
  }
  function hideFinale() {
    fz.classList.remove('on'); again2.classList.remove('on'); fz.hidden = true;
    mem.classList.remove('fading'); document.body.classList.remove('finale');
    window.__bqFinale = 0;
  }
  again2.addEventListener('click', e => {
    e.stopPropagation();
    timers.forEach(clearTimeout); timers = [];
    hideFinale();
    later(() => { window.__bqPause = true; }, 2200);
    later(() => tour(0), 600);
  });
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    hideFinale();
    started = false; window.__bqPause = false;
    mem.classList.remove('on'); pola.classList.remove('on'); top.classList.remove('on'); tiny.classList.remove('on'); lb.classList.remove('on'); askbtn.classList.remove('on'); ask.classList.remove('on');
    setTimeout(() => { if (!started) mem.hidden = true; }, 600);
  }
  // seulement le 1er : une petite question pour le 11 😏
  const askbtn = document.getElementById('askbtn'), ask = document.getElementById('ask'), win = document.getElementById('win');
  let answer = null;
  try { answer = localStorage.getItem('bq-rep'); if (answer) win.classList.add('answered'); } catch (e) {}
  askbtn.addEventListener('click', e => { e.stopPropagation(); ask.classList.add('on'); });
  const closeAsk = () => ask.classList.remove('on');
  document.getElementById('later').addEventListener('click', closeAsk);
  document.getElementById('x').addEventListener('click', closeAsk);
  ask.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    ask.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    answer = b.querySelector('span').textContent.trim();
    try { localStorage.setItem('bq-rep', answer); } catch (e) {}
    setTimeout(() => win.classList.add('answered'), 450);
  }));
  document.getElementById('send').addEventListener('click', async () => {
    const text = `ma réponse pour le 11 : ${answer} ♥`;
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  });
  addEventListener('bq:regrow', () => { window.__bqTapped = false; reset(); });
  (function watch() {
    const st = window.__bq;
    if (st && st.opened && !started && window.__bqTapped) start(st);
    requestAnimationFrame(watch);
  })();
})();
</script>
