/* polices : jetbrains mono (mon éditeur) + une écriture à la main */
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --bg:#040404; --ink:#ebe5d8; --muted:#8a8478; --dim:#55514a; --line:#262523;
  --pink:#f06b8a; --rose:#f6a3b6; --gold:#f1c53f;
  --cmt:#6a9955;   /* le vert des commentaires dans vs code */
  --ok:#89d185;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --hand:"Main","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:400 14px/1.55 var(--mono);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:1px dashed var(--rose);outline-offset:4px}
.cmt{color:var(--cmt)}
.hand{font-family:var(--hand);font-weight:400}
.emo{white-space:nowrap;font-family:system-ui,sans-serif}
/* le curseur qui clignote */
.cur{display:inline-block;width:.58em;height:1.15em;margin-left:1px;vertical-align:-.2em;background:var(--pink);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* texte tapé : le "fantôme" réserve la place pour que rien ne bouge */
.tl{display:grid}
.tl > *{grid-area:1/1}
.ghost{visibility:hidden}

/* ---- écran d'accueil ---- */
.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding-top:var(--nb,38vh);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  transition:opacity .9s}
.intro.gone{opacity:0;pointer-events:none}
.intro .cmt{margin:0;font-size:13px;opacity:0;transition:opacity 1s}
.intro .hi{margin:clamp(14px,3.2vh,30px) 0 0;font-size:clamp(60px,17vw,104px);line-height:1;color:var(--rose);
  transform:rotate(-4deg);clip-path:inset(-30% 100% -30% 0);transition:clip-path 1.5s cubic-bezier(.55,0,.35,1)}
.intro .say{margin:6px 0 0;font-size:clamp(14px,3.9vw,17px);min-height:1.6em}
.intro.s1 .cmt{opacity:1}
.intro.s2 .hi{clip-path:inset(-30% -10% -30% -10%)}
.key{margin-top:clamp(24px,4.6vh,40px);padding:11px 22px 9px;background:#111;border:1px solid #2f2d2a;border-bottom-width:4px;border-radius:10px;
  font-weight:700;font-size:15px;color:var(--ink);opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s,border-color .2s}
.key.on{opacity:1;transform:none}
.key:hover{border-color:var(--pink)}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key i{font-style:normal;color:var(--pink);margin-left:6px}
.sig{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin:0;font-size:11px;color:var(--dim)}

/* ---- le calendrier de l'avent ---- */
.cal{width:min(100%,370px);margin-top:clamp(18px,3.2vh,30px);opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s}
.cal.on{opacity:1;transform:none}
.calh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px;font-size:11px;color:var(--cmt)}
.calh b{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.calh a{color:var(--rose);text-decoration:none;border-bottom:1px dashed currentColor}
.grid{display:grid;grid-template-columns:repeat(5,1fr) 1.3fr;gap:6px}
.door{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:7px;background:#0d0c0d;perspective:420px;cursor:pointer}
.door.d11{grid-column:6;grid-row:1 / span 2;aspect-ratio:auto}
.door .th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px;opacity:0;transition:opacity .5s}
.door.has .th{opacity:1}
.door .n{position:absolute;left:4px;top:2px;z-index:2;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.leaf{position:absolute;inset:0;z-index:3;display:grid;place-items:center;border:1px solid #2c2a28;border-radius:7px;background:linear-gradient(160deg,#1b1819,#0e0d0e);
  transform-origin:left center;transition:transform 1.1s cubic-bezier(.45,0,.2,1),opacity .35s .85s;backface-visibility:hidden}
.leaf b{font-size:clamp(15px,4.4vw,19px);font-weight:700;color:var(--ink)}
.leaf i{position:absolute;right:4px;bottom:2px;font-style:normal;font-size:10px}
.door.locked .leaf b{color:var(--dim)}
.door.locked .leaf i{opacity:.6}
.door.today .leaf{border-color:var(--pink);animation:glow 2s ease-in-out infinite}
.door.today .leaf b{color:var(--rose)}
.door.missed .leaf{border-style:dashed;border-color:#5a3f48}
.door.missed .leaf i{color:var(--pink);font-weight:700}
.door.open .leaf{transform:rotateY(-108deg);opacity:0;pointer-events:none}
.door.d11 .leaf{background:linear-gradient(160deg,#2b2210,#120f08);border-color:#6a5420}
.door.d11 .leaf b{font-size:22px;color:var(--gold)}
.door.d11 .leaf i{right:auto;left:50%;bottom:10px;transform:translateX(-50%);font-size:15px}
.door.view{outline:1px dashed var(--rose);outline-offset:2px}
.door.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px rgba(240,107,138,.25),0 0 12px rgba(240,107,138,.25)}50%{box-shadow:0 0 0 1px rgba(240,107,138,.5),0 0 26px rgba(240,107,138,.6)}}
.next{margin:9px 0 0;font-size:11px;color:var(--muted)}
.next b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,12px);width:max-content;max-width:calc(100% - 32px);
  padding:9px 14px;background:#141213;border:1px solid #3b2a30;border-radius:9px;font-size:13px;line-height:1.45;color:var(--ink);text-align:center;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.tap{pointer-events:auto;cursor:pointer}
.toast b{font-weight:400;color:var(--rose);font-variant-numeric:tabular-nums}
/* la case ouverte */
.cpola{margin:10px auto 0;padding:9px 9px 0;width:min(100%,290px);background:#f6f2e8;border-radius:2px;transform:rotate(-2deg);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.cpola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9d3c7;transition:opacity .5s}
.cpola img.fade{opacity:0}
.cpola figcaption{padding:9px 4px 11px;font:400 clamp(20px,5.6vw,25px)/1.1 var(--hand);color:#29241f;text-align:center}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:16px}
.crow .send,.crow .close{margin-top:0}
@media (max-height:740px){
  .sig{display:none}
  .intro .hi{margin-top:10px;font-size:clamp(50px,14vw,80px)}
  .key{margin-top:16px}
  .cal{margin-top:14px}
}
@media (prefers-reduced-motion: reduce){.cal,.leaf,.door .th,.toast{transition:none}.door.today .leaf{animation:none}}

/* ---- pendant que le bouquet pousse ---- */
.term{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 24px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);
  margin:0;text-align:left;pointer-events:none;font-size:clamp(13px,3.6vw,16px);line-height:1.65;opacity:0;transition:opacity .5s}
.term.show{opacity:1}
.term .p{color:var(--pink)}
.term .l2{color:var(--rose)}

/* ---- le message sous son prénom ---- */
.fin{position:fixed;left:0;right:0;margin:0;text-align:center;pointer-events:none;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.fin .big{display:inline-block;font-family:var(--hand);font-size:clamp(36px,10vw,58px);line-height:1.05;color:var(--rose);text-shadow:0 0 22px rgba(240,107,138,.35);
  transform:rotate(-2.5deg);clip-path:inset(-40% 100% -40% 0);transition:clip-path 1.7s cubic-bezier(.55,0,.35,1)}
.fin.show .big{clip-path:inset(-40% -5% -40% -5%)}
.fin .sm{display:block;margin-top:12px;font-size:clamp(13px,3.6vw,16px);line-height:1.65;opacity:0;transition:opacity 1s .2s}
.fin.show .sm{opacity:1;transition-delay:1.5s}
.fin .tap{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-family:var(--hand);font-size:clamp(21px,5.6vw,27px);color:var(--ink);
  opacity:0;transform:rotate(-1.5deg);transition:opacity 1s}
.fin.show .tap{opacity:.95;transition-delay:2.8s;animation:breathe 3s ease-in-out 4s infinite}
.fin .tap svg{width:1.1em;height:1.1em;flex:none}
@keyframes breathe{50%{opacity:.4}}
.again{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:7px 11px;background:rgba(4,4,4,.7);border:1px solid var(--line);border-radius:7px;font-size:12px;color:var(--muted);
  opacity:0;pointer-events:none;transition:opacity 1.2s,color .2s,border-color .2s}
.again.show{opacity:1;pointer-events:auto}
.again:hover{color:var(--ink);border-color:var(--dim)}
@media (prefers-reduced-motion: reduce){
  .cur{animation:none}.intro .hi,.fin .big{clip-path:none!important;transition:none}
  .intro .cmt,.key,.fin .sm,.fin .tap,.term,.intro{transition:none}.fin .tap{animation:none}
}

/* ---- la surprise du jour : la carte + la photo ---- */
.mem{position:fixed;inset:0;z-index:5;opacity:0;transition:opacity 1.6s ease;background:var(--bg)}
.mem.on{opacity:1}
#map{position:absolute;inset:0;background:#040404}
.vig{position:absolute;inset:0;pointer-events:none;z-index:401;background:linear-gradient(180deg,rgba(4,4,4,.93) 0,rgba(4,4,4,.72) 140px,rgba(4,4,4,0) 230px),radial-gradient(ellipse at 50% 32%,rgba(4,4,4,0) 30%,rgba(4,4,4,.88) 100%)}
.memtop{position:absolute;z-index:402;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);text-align:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));opacity:0;transition:opacity 1.2s}
.memtop.on{opacity:1}
.memtop .cmt{font-size:12px}
.memtop .hand{display:block;margin-top:2px;font-size:clamp(23px,6vw,31px);line-height:1.1;transform:rotate(-1.5deg)}
.pola{position:absolute;z-index:403;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);width:min(70vw,320px,calc((100vh - 260px) * .64));margin:0;padding:10px 10px 0;
  background:#f6f2e8;border-radius:2px;box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.08);cursor:zoom-in;
  transform:translate(-50%,130%) rotate(-7deg);opacity:0;transition:transform 1.5s cubic-bezier(.2,.9,.25,1.12),opacity 1s}
.pola.on{transform:translate(-50%,0) rotate(-3deg);opacity:1}
/* un bout de scotch de masquage */
.pola::before{content:"";position:absolute;top:-13px;left:50%;width:98px;height:28px;transform:translateX(-50%) rotate(4deg);background:rgba(231,219,188,.86);
  box-shadow:0 1px 2px rgba(0,0,0,.18);clip-path:polygon(3% 0,97% 0,100% 18%,96% 34%,100% 52%,97% 70%,100% 86%,97% 100%,3% 100%,0 84%,4% 66%,0 49%,3% 31%,0 14%)}
.pola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9d3c7;transition:opacity .6s}
.pola img.fade{opacity:0}
.pola figcaption{font:400 clamp(23px,6.2vw,29px)/1 var(--hand);color:#29241f;text-align:center;padding:10px 4px 13px}
.pin{width:18px;height:18px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 4px rgba(240,107,138,.35),0 0 24px 6px rgba(240,107,138,.6);animation:pin 2s ease-out infinite}
@keyframes pin{0%{box-shadow:0 0 0 0 rgba(240,107,138,.6),0 0 24px 6px rgba(240,107,138,.6)}100%{box-shadow:0 0 0 22px rgba(240,107,138,0),0 0 24px 6px rgba(240,107,138,.6)}}
.past{width:9px;height:9px;border-radius:50%;background:#f6d6de;opacity:.75;box-shadow:0 0 10px rgba(246,214,222,.6)}
.leaflet-container{background:#040404;font-family:var(--mono)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.45)}
.leaflet-control-attribution{background:rgba(4,4,4,.55)!important;color:#6d685c!important;font-size:8px!important}
.leaflet-control-attribution a{color:#8a8578!important}
.tiny{position:absolute;z-index:403;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);pointer-events:none;
  font:400 19px/1 var(--hand);color:var(--muted);transform:rotate(-3deg);opacity:0;transition:opacity 1.2s}
.tiny.on{opacity:1}
.lb{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,4,4,.94);opacity:0;pointer-events:none;transition:opacity .45s;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.lb.on{opacity:1;pointer-events:auto;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.7);transform:scale(.94);transition:transform .45s cubic-bezier(.2,.9,.25,1.1)}
.lb.on img{transform:none}
.mem{transition:opacity 1.6s ease,background-color 3.2s ease}
#map,.vig{transition:opacity 3.2s ease}
.mem.fading{background-color:transparent}
.mem.fading #map,.mem.fading .vig{opacity:0}
body.finale .fin,body.finale .term{visibility:hidden}
/* le final du 11 */
.finale{position:absolute;z-index:405;left:0;right:0;top:var(--fy,52vh);margin:0;text-align:center;pointer-events:none;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.finale .cmt{margin:0;font-size:12px;opacity:0;transition:opacity 1s}
.finale.on .cmt{opacity:1}
.fbig{margin:4px auto 0;max-width:12em;font-size:clamp(36px,10vw,60px);line-height:1.02;color:var(--rose);text-shadow:0 0 22px rgba(240,107,138,.35);text-wrap:balance;
  transform:rotate(-2deg);clip-path:inset(-40% 100% -40% 0);transition:clip-path 2.2s cubic-bezier(.55,0,.35,1)}
.finale.on .fbig{clip-path:inset(-40% -6% -40% -6%)}
.flines{width:max-content;max-width:100%;margin:16px auto 0;text-align:left;font-size:clamp(13px,3.6vw,16px);line-height:1.75}
.flines .p{color:var(--pink)}
.again2{margin-top:24px;padding:9px 15px;background:rgba(4,4,4,.6);border:1px solid var(--pink);border-radius:7px;color:var(--rose);font-size:13px;
  opacity:0;transform:translateY(6px);transition:opacity .9s,transform .9s,background-color .2s;pointer-events:none}
.again2.on{opacity:1;transform:none;pointer-events:auto}
.again2:hover{background:#2a1a20}
@media (prefers-reduced-motion: reduce){.fbig{clip-path:none!important;transition:none}.mem,#map,.vig,.again2,.finale .cmt{transition:none}}
.calbtn{position:fixed;z-index:25;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding:8px 13px;
  background:rgba(12,12,12,.92);border:1px solid var(--pink);border-radius:8px;font-size:13px;color:var(--rose);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .9s,transform .9s}
.calbtn.on{opacity:1;transform:none;pointer-events:auto;animation:glow 2.4s ease-in-out 1s infinite}
.frow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.frow .again2{margin-top:0}
/* la musique du 11 */
.music{position:fixed;z-index:45;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,env(safe-area-inset-right,0px));display:grid;place-items:center;width:36px;height:36px;padding:0;
  background:rgba(10,10,10,.78);border:1px solid #2f2d2a;border-radius:50%}
.music .eq{display:flex;gap:2px;align-items:flex-end;height:13px}
.music .eq i{width:3px;height:4px;border-radius:1px;background:var(--pink);animation:eq .9s ease-in-out infinite}
.music .eq i:nth-child(2){animation-delay:.25s}.music .eq i:nth-child(3){animation-delay:.5s}
.music.off .eq i{animation:none;height:4px;background:var(--dim)}
@keyframes eq{50%{height:13px}}
body.music .term{top:calc(env(safe-area-inset-top,0px) + 58px)}
body.music .memtop{padding-left:58px;padding-right:58px}
/* ---- la surprise du jour : un format différent chaque jour ---- */
.act{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 64px) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse 90% 55% at 50% 40%,#1d1016 0%,#0b0709 62%,var(--bg) 100%);opacity:0;transition:opacity .9s}
.act.on{opacity:1}
.ahead{text-align:center}
.ahead .cmt{margin:0;font-size:12px}
.atitle{margin:2px 0 0;font:400 clamp(28px,7.6vw,38px)/1.05 var(--hand);color:var(--rose);transform:rotate(-1.5deg)}
.astage{position:relative;flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.afoot{min-height:94px;text-align:center;padding-inline:8px}
.amsg{margin:0;font:400 clamp(21px,5.6vw,27px)/1.15 var(--hand);color:var(--ink);opacity:0;transform:translateY(6px);transition:opacity .9s,transform .9s}
.atease{margin:6px 0 0;font-size:12px;color:var(--muted);opacity:0;transition:opacity .9s .6s}
.act.adone .amsg,.act.adone .atease{opacity:1;transform:none}
.pzinfo{font-size:12px;color:var(--muted)}
.dg{font-family:var(--mono);font-size:.74em;letter-spacing:-.03em}
/* carte à gratter */
.scard{position:relative;width:min(76vw,320px,calc((100vh - 330px) * .8));aspect-ratio:4/5;border-radius:12px;overflow:hidden;box-shadow:0 0 0 7px #f6f2e8,0 22px 50px rgba(0,0,0,.6);transform:rotate(-1.5deg)}
.scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foil{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .8s}
.foil.gone{opacity:0;pointer-events:none}
.shint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 11px;border-radius:999px;background:rgba(20,12,16,.82);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.shint.off{opacity:0}
.scard.won{cursor:zoom-in}
/* quiz */
.qprog{font-size:12px;color:var(--muted)}
.qprog.big{font:400 44px/1 var(--hand);color:var(--gold)}
.qpola{margin:0;width:min(60vw,240px,calc((100vh - 420px) * .8));background:#f6f2e8;padding:8px 8px 24px;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.5);transform:rotate(2deg);transition:opacity .35s,transform .35s}
.qpola.swap{opacity:0;transform:rotate(2deg) translateY(8px)}
.qpola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9d3c7}
.qopts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:360px}
.qopt{padding:10px 17px;border:1px solid #3b2a30;border-radius:999px;background:#140f11;color:var(--ink);font-size:14px;transition:background .2s,border-color .2s}
.qopt:hover:not(:disabled){border-color:var(--pink)}
.qopt.ok{background:#16301a;border-color:#6fcf75;color:#d9ffdb}
.qopt.ko{background:#3a161c;border-color:#e3242b;animation:shake .45s}
.qopt:disabled{cursor:default}
.qfb{min-height:1.2em;font:400 23px/1.1 var(--hand);color:var(--ink)}
/* photomaton */
.booth{display:flex;flex-direction:column;align-items:center}
.bslot{position:relative;z-index:2;width:calc(var(--sw) + 44px);height:14px;border-radius:7px;background:#020202;box-shadow:inset 0 3px 6px #000,0 0 0 1px #2c2627,0 6px 14px rgba(0,0,0,.6)}
.bwin{margin-top:-7px;padding:0 10px 22px;overflow:hidden}
.strip{display:grid;gap:6px;width:var(--sw);padding:8px;background:#fbfaf6;box-shadow:0 14px 30px rgba(0,0,0,.55);transform:translateY(-104%);cursor:zoom-in}
.booth.print .strip{animation:print 2.8s steps(16,end) forwards}
@keyframes print{to{transform:translateY(0) rotate(-1deg)}}
.strip img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.sfoot{padding:4px 0 2px;text-align:center;font:400 20px/1 var(--hand);color:#3a2f2a}
.flash{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
/* attrape les cœurs */
.hcount{font:400 30px/1 var(--hand);color:var(--gold)}
.hcount.bump{animation:bump .3s}
.hcount.big{font-size:42px}
@keyframes bump{50%{transform:scale(1.25)}}
.hfield{position:relative;flex:1;width:100%;overflow:hidden;touch-action:manipulation}
.fheart{position:absolute;left:0;top:0;width:58px;height:58px;padding:0;border:0;background:none;font-size:40px;line-height:58px;text-shadow:0 0 18px currentColor;cursor:pointer;will-change:transform}
.fheart.pop{animation:pop .4s forwards;pointer-events:none}
@keyframes pop{to{opacity:0;scale:1.9}}
.rpola{margin:0;width:min(68vw,280px,calc((100vh - 340px) * .78));background:#f6f2e8;padding:8px 8px 0;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.5);
  transform:translateY(40px) rotate(-5deg) scale(.9);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.25,1.2),opacity .6s;cursor:zoom-in}
.rpola.on{transform:rotate(-2deg);opacity:1}
.rpola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9d3c7}
.rpola figcaption,.wpol figcaption{padding:8px 4px 10px;text-align:center;font:400 clamp(19px,5vw,23px)/1.1 var(--hand);color:#29241f}
/* le mur */
.wall{display:grid;grid-template-columns:repeat(2,var(--ww,150px));gap:18px 14px;justify-content:center;max-height:100%;overflow-y:auto;padding:12px 6px}
.wpol{position:relative;margin:0;background:#f6f2e8;padding:6px 6px 0;border-radius:2px;box-shadow:0 12px 26px rgba(0,0,0,.5);transform:rotate(var(--r,0deg));animation:drop .6s cubic-bezier(.2,.9,.25,1.2) backwards;cursor:zoom-in}
.wpol::before{content:"";position:absolute;z-index:1;top:-9px;left:50%;width:54px;height:18px;transform:translateX(-50%) rotate(-3deg);background:rgba(231,219,188,.88);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.wpol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#d9d3c7}
.wpol figcaption{font-size:17px;padding:6px 2px 8px}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(1.08)}}
/* puzzle */
.pz{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 0 0 7px #f6f2e8,0 20px 50px rgba(0,0,0,.6);background:#222}
.tile{position:absolute;left:0;top:0;padding:0;border:0;background-repeat:no-repeat;box-shadow:inset 0 0 0 1px rgba(10,6,8,.9);transition:transform .35s cubic-bezier(.3,.8,.3,1),box-shadow .3s,filter .2s;cursor:pointer}
.tile.sel{z-index:2;box-shadow:inset 0 0 0 3px var(--pink);filter:brightness(1.15)}
.pz.solved .tile{box-shadow:none;cursor:default}
.pz.solved{animation:bump .7s}
/* valide ou valide */
.stack{position:relative;width:min(72vw,300px,calc((100vh - 370px) * .75));aspect-ratio:3/4}
.sw{position:absolute;inset:0;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 18px 40px rgba(0,0,0,.55);
  transform:translateY(calc(var(--k) * 10px)) scale(calc(1 - var(--k) * .04));transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;touch-action:none;user-select:none;-webkit-user-select:none}
.sw img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.swlab{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));font:400 21px/1.1 var(--hand);color:#fff}
.stamp{position:absolute;top:18px;left:14px;padding:3px 10px;border:3px solid #6fcf75;border-radius:8px;color:#6fcf75;font:700 17px var(--mono);transform:rotate(-14deg);opacity:0;transition:opacity .2s}
.sw.hint .stamp,.sw.liked .stamp{opacity:1}
.sw.wig{animation:wig .45s}
@keyframes wig{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}
.sbtns{display:flex;gap:28px;align-items:center}
.sbtn{width:60px;height:60px;border-radius:50%;border:1px solid #3b2a30;background:#140f11;font-size:24px;line-height:1;transition:transform .35s cubic-bezier(.3,1.4,.4,1),border-color .2s}
.sbtn.no{color:var(--muted)}
.sbtn.yes{color:var(--pink);border-color:var(--pink);box-shadow:0 0 22px rgba(240,107,138,.35)}
.squip{min-height:1.2em;font:400 22px/1.1 var(--hand);color:var(--ink)}
.sfan{position:relative;width:min(84vw,330px);height:min(46vh,290px,calc(100vh - 380px));min-height:190px}
.sfc{position:absolute;left:50%;bottom:4%;width:40%;aspect-ratio:3/4;margin-left:-20%;padding:0;border:3px solid #f6f2e8;border-radius:10px;overflow:hidden;background:#111;
  box-shadow:0 12px 26px rgba(0,0,0,.55);transform-origin:50% 135%;transform:rotate(var(--a));animation:fanin .7s cubic-bezier(.3,1.3,.4,1) backwards;cursor:zoom-in}
.sfc img{display:block;width:100%;height:100%;object-fit:cover}
@keyframes fanin{from{opacity:0;transform:rotate(0deg) translateY(36px)}}
.sfan .stamp{z-index:9;top:auto;bottom:-6px;left:50%;opacity:1;transform:translateX(-50%) rotate(-8deg);background:#0d0a0b;font-size:15px;animation:stampin .45s .9s cubic-bezier(.3,1.6,.4,1) backwards}
@keyframes stampin{from{opacity:0;scale:1.8}}
/* nous, en chiffres (façon stories) */
.story{position:relative;width:var(--stw);height:calc(var(--stw) * 16 / 9);border-radius:16px;overflow:hidden;background:#0c0a0b;box-shadow:0 0 0 1px #2a2225,0 24px 60px rgba(0,0,0,.6);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.stbars{position:absolute;z-index:3;left:10px;right:10px;top:10px;display:flex;gap:4px}
.stbars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.stbars b{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(var(--p,0))}
.sts{position:absolute;inset:0;opacity:0;transition:opacity .55s}
.sts.on{opacity:1}
.sts img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform 7s linear}
.sts.on img{transform:scale(1.12)}
/* photo pas au bon format : on la montre en entier, sur un fond flou */
.sts.fit img.bgb{filter:blur(18px) brightness(.5) saturate(1.2);transform:scale(1.25);transition:none}
.sts.fit img.fg{object-fit:contain;object-position:50% 0;transform-origin:50% 0}
.sts.fit.on img.fg{transform:scale(1.04)}
.sts::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,transparent 18%,transparent 50%,rgba(10,6,8,.88) 84%)}
.stx{position:absolute;z-index:2;left:18px;right:18px;bottom:24px}
.stn{padding:0 .06em;font:700 calc(var(--stw) * .3)/1 var(--mono);letter-spacing:-.05em;background:linear-gradient(115deg,var(--gold),var(--pink) 70%);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(16px);transition:opacity .5s .15s,transform .8s cubic-bezier(.2,.9,.25,1.2) .15s}
.stt{margin-top:4px;font:400 calc(var(--stw) * .1)/1.05 var(--hand);color:#fff;opacity:0;transform:translateY(10px);transition:opacity .7s .4s,transform .7s .4s}
.stt.solo{font-size:calc(var(--stw) * .135)}
.stsub{margin-top:9px;font-size:12px;line-height:1.45;color:rgba(255,255,255,.72);opacity:0;transition:opacity .7s .7s}
.sts.on .stn,.sts.on .stt,.sts.on .stsub{opacity:1;transform:none}
.sttap{position:absolute;z-index:3;right:12px;top:24px;font-size:11px;color:rgba(255,255,255,.75);animation:soft 2.2s ease-in-out infinite;pointer-events:none}
@keyframes soft{50%{opacity:.4}}
/* le billet */
.tk{--u:calc(var(--tw) / 100);position:relative;width:var(--tw);filter:drop-shadow(0 22px 30px rgba(0,0,0,.55));transform:translateY(34px) rotate(-5deg);opacity:0;transition:transform 1s cubic-bezier(.2,.9,.25,1.15),opacity .7s}
.tk.on{transform:rotate(-2deg);opacity:1}
.tkm,.tks{position:relative;background:#f7f1e5;color:#2b2320}
.tkm{border-radius:14px 14px 0 0;overflow:hidden;
  -webkit-mask:radial-gradient(circle calc(var(--u) * 4.5) at 0 100%,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle calc(var(--u) * 4.5) at 100% 100%,#0000 98%,#000) 100% 0/51% 100% no-repeat;
  mask:radial-gradient(circle calc(var(--u) * 4.5) at 0 100%,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle calc(var(--u) * 4.5) at 100% 100%,#0000 98%,#000) 100% 0/51% 100% no-repeat}
.tkm::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%);transform:translateX(-130%);animation:shine 1.5s 1s ease-in-out forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(130%)}}
.tkp{position:relative;aspect-ratio:16/9;background:#d9d3c7;cursor:zoom-in}
.tkp img{display:block;width:100%;height:100%;object-fit:cover}
.tkb{padding:calc(var(--u) * 5.5) calc(var(--u) * 6.5) calc(var(--u) * 6)}
.tkh{display:flex;justify-content:space-between;font:700 max(9px,calc(var(--u) * 3.2)) var(--mono);letter-spacing:.18em;text-transform:uppercase;color:#c2183f}
.tkh span+span{color:#9a8e80;letter-spacing:.1em}
.tkn{margin:calc(var(--u) * 1.5) 0 calc(var(--u) * 3);font:400 calc(var(--u) * 13)/1 var(--hand);color:#2b2320}
.tkd{margin:0;display:grid;gap:calc(var(--u) * 1.8)}
.tkd div{display:grid;grid-template-columns:calc(var(--u) * 17) 1fr;align-items:baseline}
.tkd dt{font:400 max(9px,calc(var(--u) * 3.1)) var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9a8e80}
.tkd dd{margin:0;font:400 max(10.5px,calc(var(--u) * 4.2))/1.3 var(--mono);color:#2b2320}
.tkv{margin-top:calc(var(--u) * 4);padding-top:calc(var(--u) * 3);border-top:1px solid #e4d9c7;font:400 max(9px,calc(var(--u) * 3.1))/1.4 var(--mono);color:#9a8e80}
.tks{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u) * 4);padding:calc(var(--u) * 5) calc(var(--u) * 6.5);border-radius:0 0 14px 14px;background:#efe6d5;
  background-image:linear-gradient(90deg,#cbbfa9 50%,transparent 0);background-size:12px 2px;background-repeat:repeat-x;background-position:0 0;
  -webkit-mask:radial-gradient(circle calc(var(--u) * 4.5) at 0 0,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle calc(var(--u) * 4.5) at 100% 0,#0000 98%,#000) 100% 0/51% 100% no-repeat;
  mask:radial-gradient(circle calc(var(--u) * 4.5) at 0 0,#0000 98%,#000) 0 0/51% 100% no-repeat,radial-gradient(circle calc(var(--u) * 4.5) at 100% 0,#0000 98%,#000) 100% 0/51% 100% no-repeat;
  transform-origin:12% 0;touch-action:none;cursor:grab;transition:transform .5s cubic-bezier(.3,1.4,.4,1)}
.tkbar{display:flex;height:calc(var(--u) * 12)}
.tkbar i{background:#2b2320}
.tksr{text-align:right}
.tksr b{display:block;font:700 calc(var(--u) * 7.5)/1 var(--mono);letter-spacing:-.02em;color:#2b2320}
.tksr span{font:400 max(9px,calc(var(--u) * 3)) var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9a8e80}
.tks.torn{transform:translateY(105vh) rotate(28deg);transition:transform 1.5s cubic-bezier(.55,0,.85,.45)}
.tk.kept .tkm{animation:bump .6s}
.tkst{position:absolute;z-index:2;right:calc(var(--u) * 5);top:calc(var(--u) * 40);padding:3px 10px;border:2.5px solid #c2183f;border-radius:7px;background:rgba(247,241,229,.9);color:#c2183f;
  font:700 max(12px,calc(var(--u) * 4.4)) var(--mono);transform:rotate(-10deg);animation:stampin .45s cubic-bezier(.3,1.6,.4,1) backwards}
.tkhint{margin-top:2px;animation:soft 2.2s ease-in-out infinite}
/* le 12 : jeu de piste */
.hunt{width:min(100%,390px);max-height:100%;min-height:0;display:flex;flex-direction:column;gap:12px}
.hdots{display:flex;justify-content:center;gap:7px;flex:none}
.hdots i{width:8px;height:8px;border-radius:50%;background:#3a2c31;transition:background .4s,transform .4s}
.hdots i.on{background:var(--rose);transform:scale(1.3)}
.hdots i.ok{background:var(--gold)}
.hcard{position:relative;min-height:0;overflow-y:auto;padding:18px 18px 16px;border-radius:14px;background:#f7f1e5;color:#2b2320;box-shadow:0 20px 44px rgba(0,0,0,.5);transform:rotate(-.8deg)}
.hcard.in{animation:hin .6s cubic-bezier(.2,.9,.25,1.15)}
@keyframes hin{from{opacity:0;transform:translateY(18px) rotate(-3deg)}}
.hcard.no{animation:hno .4s}
@keyframes hno{25%{translate:-7px 0}50%{translate:6px 0}75%{translate:-3px 0}}
.hmeta{margin:0 0 8px;font:700 10px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#c2183f}
.hr{margin:0 0 12px;font:400 clamp(19px,5.3vw,22px)/1.3 var(--hand);color:#2b2320}
.hr.sm{font-size:clamp(17px,4.7vw,20px)}
.hr.big{margin-bottom:8px;font-size:clamp(28px,8vw,34px);line-height:1.05;color:#c2183f}
.hbtn{display:block;margin:4px auto 0;padding:11px 18px;border:0;border-radius:9px;background:#2b2320;color:#f7f1e5;font:700 13px var(--mono);cursor:pointer}
.hlink{white-space:nowrap;padding:6px 0;border:0;background:none;font:400 12px var(--mono);color:#7d7166;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.hmap{height:clamp(128px,26vh,240px);margin:2px 0 10px;border-radius:10px;overflow:hidden;background:#111}
.hmap.hfin{height:clamp(110px,20vh,200px)}
.hreset{align-self:center;flex:none;padding:4px 10px;border:0;background:none;font:400 11.5px var(--mono);color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.hreset.sure{color:var(--rose)}
.hmgrs{margin:0 0 8px;font:700 clamp(17px,5vw,21px)/1.2 var(--mono);letter-spacing:.06em;color:#2b2320;white-space:nowrap}
.hmgrs small{font-size:.62em;letter-spacing:.14em;color:#9a8e80;margin-right:6px}
.hgo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.hgo .hbtn{margin:0}
.hbtn.near{animation:near 1.2s ease-in-out infinite}
@keyframes near{50%{box-shadow:0 0 0 7px rgba(194,24,63,.25)}}
.hgeo{min-height:1.3em;margin:6px 0 0;font:400 12px/1.4 var(--mono);color:#7d7166}
.hgl{font:700 10px var(--mono);color:rgba(241,197,63,.75);white-space:nowrap;transform:translate(-50%,-50%)}
.htg{position:relative;width:22px;height:22px;transform:translate(-50%,-50%)}
.htg::before,.htg::after{content:"";position:absolute;inset:0;border-radius:50%;border:2.5px solid var(--pink)}
.htg::after{inset:7px;border:0;background:var(--pink)}
.htg i{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--pink);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.7)}}
.hdone{width:9px;height:9px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.hme{width:14px;height:14px;border-radius:50%;background:#4aa3ff;border:2.5px solid #fff;box-shadow:0 0 0 5px rgba(74,163,255,.3);transform:translate(-50%,-50%)}
.hpin{display:flex;align-items:center;gap:5px;white-space:nowrap;transform:translate(-7px,-50%)}
.hlbl{font:700 10.5px var(--mono);color:#f7f1e5;background:rgba(10,7,8,.85);padding:2px 6px;border-radius:5px;white-space:nowrap;transform:translate(12px,-50%)}
.hpin b{width:14px;height:14px;flex:none;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px rgba(240,107,138,.35)}
.hpin.g b{background:var(--gold);box-shadow:0 0 0 3px rgba(241,197,63,.35)}
.hpin span{padding:2px 7px;border-radius:6px;background:rgba(10,7,8,.85);font:700 11px var(--mono);color:#f7f1e5}
.resume{margin-top:12px;padding:6px 10px;border:0;background:none;font:400 13px var(--mono);color:var(--rose);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
@media (prefers-reduced-motion: reduce){
  .act,.amsg,.atease,.rpola,.tile,.sw,.qpola,.sts,.sts img,.stn,.stt,.stsub,.tk{transition:none}.tkm::after,.hcard.in,.hcard.no{animation:none}
  .booth.print .strip{animation:none;transform:none}.wpol,.fheart.pop,.hcount.bump{animation:none}
}

  // le 12 : jeu de piste en coordonnées MGRS (comme à l'armée). un point sur la carte, on y va, « j'y suis », on passe au suivant.
  // sa progression est gardée sur son téléphone.
  const utm31 = (lat, lon) => {
    const a = 6378137, f = 1 / 298.257223563, k0 = .9996, e2 = f * (2 - f), ep = e2 / (1 - e2), r = Math.PI / 180;
    const p = lat * r, sp = Math.sin(p), cp = Math.cos(p), tp = Math.tan(p);
    const N = a / Math.sqrt(1 - e2 * sp * sp), T = tp * tp, C = ep * cp * cp, A = cp * (lon - 3) * r;
    const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * p - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * p) + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * p) - 35 * e2 ** 3 / 3072 * Math.sin(6 * p));
    return [500000 + k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep) * A ** 5 / 120),

  };

  const mgrsOf = (lat, lon) => {
    const [E, N] = utm31(lat, lon);
    if (E < 500000 || E >= 600000 || N < 5600000 || N >= 5700000) return '';
    const q = v => String(Math.floor(v / 10) % 10000).padStart(4, '0');
    return `31U ES ${q(E)} ${q(N)}`;

    const icon = (cls, html = '') => L.divIcon({ className: '', html: `<div class="${cls}">${html}</div>`, iconSize: [0, 0] });
    let mp = null, me = null, here = null, watch = null, geoEl = null, goBtn = null, target = null, fitted = false, padR = 34;
    const killMap = () => { if (mp) { try { mp.remove(); } catch (e) {} mp = null; me = null; } };

      if (target) {
        const d = dist(here, target);
        geoEl.textContent = (m ? `toi : ${m} · ` : '') + (d < 40 ? 'tu y es ✓' : `objectif à ${d < 1000 ? Math.round(d / 10) * 10 + ' m' : (d / 1000).toFixed(1) + ' km'}`);
        if (goBtn) goBtn.classList.toggle('near', d < 40);
      } else geoEl.textContent = m ? `toi : ${m}` : '';
    }
    function locate() {
      if (!navigator.geolocation) { geoEl.textContent = 'pas de gps sur ce téléphone 😅'; return; }
      if (watch != null) { placeMe(); return; }
      geoEl.textContent = 'je te cherche…';
      watch = navigator.geolocation.watchPosition(p => { here = [p.coords.latitude, p.coords.longitude]; placeMe(); },
        () => { geoEl.textContent = 'localisation refusée, pas grave 😅'; watch = null; }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
    }
    const show = () => {
      [...dots.children].forEach((d, i) => { d.className = i < k - 1 || k > N ? 'ok' : i === k - 1 ? 'on' : ''; });
      killMap(); geoEl = goBtn = target = null; rst.hidden = k === 0;
      card.classList.remove('in'); void card.offsetWidth; card.classList.add('in'); card.scrollTop = 0;
      if (k === 0) intro(); else if (k > N) fin(); else step(S[k - 1]);
    };
    const next = () => { k++; save(); show(); };
    function intro() {
      card.innerHTML = `<p class="hmeta">${txt(D.when || '')}</p><p class="hr">${dg(txt(D.intro))}</p>`;
      card.appendChild(btn('c’est parti →', 'hbtn', next));
    }
    function step(x) {
      target = x.ll; padR = 34;
      card.innerHTML = `<p class="hmeta">objectif ${k}/${N}${x.t ? ' · ' + txt(x.t) : ''}</p>`;
      const box = el('div', 'hmap'); card.appendChild(box);
      card.appendChild(el('p', 'hmgrs', `<small>MGRS</small>${txt(x.mgrs || mgrsOf(x.ll[0], x.ll[1]))}`));
      card.appendChild(el('p', 'hr', dg(txt(x.tease))));
      const row = el('div', 'hgo'); geoEl = el('p', 'hgeo');
      goBtn = btn('j’y suis ✓', 'hbtn', () => arrived(x));
      row.append(btn('📍 me localiser', 'hlink', locate), goBtn); card.append(row, geoEl);
      const prev = k > 1 ? S[k - 2].ll : null;
      requestAnimationFrame(() => drawMap(box, [{ ll: x.ll, cls: 'htg', html: '<i></i>' }], prev ? [prev, x.ll] : [x.ll]));
      if (watch != null) placeMe();
    }
    function arrived(x) {
      if (k === N) return next(); // le dernier objectif : la surprise finale
      killMap(); geoEl = goBtn = null;
      card.innerHTML = `<p class="hmeta">✓ objectif ${k} atteint</p><p class="hr">${dg(txt(x.ok))}</p>`;
      if (x.photo) {
        card.appendChild(btn(txt(x.photo), 'hbtn', () => {
          card.innerHTML = `<p class="hmeta">📸</p><p class="hr">${dg(txt(x.photoOk || ''))}</p>`;
          card.appendChild(btn('objectif suivant →', 'hbtn', next)); burst(card, 12);
        }));
      } else card.appendChild(btn(k < N - 1 ? 'objectif suivant →' : 'le dernier objectif →', 'hbtn', next));
      burst(card, 12);
      card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');
    }
    function fin() {
      const F = D.final || {}, last = S[N - 1];
      card.innerHTML = `<p class="hmeta">${txt(F.meta || 'objectif atteint')}</p><p class="hr big">${dg(txt(F.title))}</p>`;
      const box = el('div', 'hmap hfin'); card.appendChild(box); padR = 104;
      card.appendChild(el('p', 'hr sm', dg(txt(F.text))));
      const pins = (F.pins || []).map((q, i) => ({ ll: q.ll, cls: 'hpin' + (i ? ' g' : ''), html: `<b></b><span>${txt(q.n)}</span>` }));
      requestAnimationFrame(() => drawMap(box, pins, pins.map(q => q.ll).concat(last ? [last.ll] : [])));
      burst(card, 14); actDone(D);
    }
    show();
  }

  const FMT = { scratch: fScratch, quiz: fQuiz, booth: fBooth, hearts: fHearts, wall: fWall, puzzle: fPuzzle, swipe: fSwipe, stats: fStats, ticket: fTicket, hunt: fHunt };
  async function start(st) {
    started = true;
    if (st.NOVDAY >= 1 && st.NOVDAY <= 11) try { localStorage.setItem('bq-o-' + st.NOVDAY, '1'); } catch (e) {}
    if (!(await metaP)) return;
    const DD = meta.days && meta.days[st.NOVDAY];
    if (!st.ISBDAY && DD && DD.fmt && FMT[DD.fmt]) {
      actOpen(DD);
      try { await FMT[DD.fmt](DD); } catch (e) { console.error(e); actDone(DD); }
      return;
    }
    ensureMap();
    mem.hidden = false;
    requestAnimationFrame(() => { mem.classList.add('on'); map.invalidateSize(); map.setView([49.4, 11], 4.25, { animate: false }); });
    later(() => { window.__bqPause = true; }, 2200);
    const order = meta.order;
    if (st.ISBDAY) {
      // le 11 : toutes les photos une par une… et après, le final
      later(() => tour(0), 1200);
    } else {
      const d = st.NOVDAY >= 1 && st.NOVDAY <= order.length ? st.NOVDAY : (st.dayKey % order.length) + 1;
      const D = meta.days && meta.days[st.NOVDAY];
      const tail = (D && D.tease) || (st.NOVDAY >= 1 && st.NOVDAY < order.length ? 'demain, une autre surprise t’attend…' : st.NOVDAY === order.length ? 'demain c’est ton jour ♥' : 'toi & moi');
      if (st.NOVDAY >= 1 && st.NOVDAY <= 10) later(() => { tiny.classList.remove('on'); calbtn.classList.add('on'); }, 11000);
      const note = n => (meta.places[n - 1].note || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
      later(() => { drawTrail(d); show(order[d - 1], [`// jour ${d}/${order.length}`, note(order[d - 1]) || tail, tail], 4.5); }, 1200);
      if (st.NOVDAY === 1 && !st.REPLAY) later(() => askbtn.classList.add('on'), 9500); // la question resto, une seule fois (elle a déjà répondu)
    }
  }
  function tour(k) {
    const order = meta.order;
    if (lb.classList.contains('on') || document.hidden) return later(() => tour(k), 400); // on attend si elle regarde une photo en grand (ou si elle est partie)
    if (k >= order.length) return finale();
    drawTrail(k + 1);
    const note = (meta.places[order[k] - 1].note || 'toi et moi').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    show(order[k], [`// toi &amp; moi · ${k + 1}/${order.length}`, note], k ? 2.6 : 4.2);
    later(() => tour(k + 1), k ? 6000 : 8000);
  }
  const fz = document.getElementById('finale'), fbig = document.getElementById('fbig'), flines = document.getElementById('flines'), again2 = document.getElementById('again2');
  function finale() {
    const F = meta.finale || { big: 'joyeux anniversaire mon amour', lines: ['celles-là elles faneront pas 😙😉❤️'] };
    pola.classList.remove('on'); tiny.classList.remove('on'); top.classList.remove('on');
    // on recule : toute la carte de nos souvenirs
    later(() => {
      const pts = meta.order.map(n => [meta.places[n - 1].lat, meta.places[n - 1].lon]);
      top.innerHTML = `<span class="cmt">// nos ${meta.order.length} souvenirs</span><span class="hand">toi et moi ❤️</span>`;
      top.classList.add('on');
      map.flyToBounds(L.latLngBounds(pts), { paddingTopLeft: [40, 150], paddingBottomRight: [40, 70], duration: reduce ? 0 : 3.2, easeLinearity: .2 });
    }, 900);
    // puis la carte s'efface doucement…
    later(() => {
      top.classList.remove('on');
      mem.classList.add('fading'); document.body.classList.add('finale');
      window.__bqFinale = performance.now(); window.__bqPause = false;
    }, reduce ? 600 : 6800);
    // … et il reste juste ça
    later(() => {
      fbig.textContent = F.big;
      flines.innerHTML = '';
      const rows = F.lines.map(l => {
        const r = document.createElement('div'); r.className = 'tl';
        r.innerHTML = `<span class="ghost">&gt; ${l}&nbsp;</span><span class="typed"></span>`;
        flines.appendChild(r); return { el: r.lastChild, text: l };
      });
      fz.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => fz.classList.add('on')));
      const cur = Object.assign(document.createElement('span'), { className: 'cur' });
      let i = 0, c = 0;
      const tick = () => {
        if (i >= rows.length) return later(() => { again2.classList.add('on'); calbtn2.classList.add('on'); }, 500);
        const chars = Array.from(rows[i].text);
        c++;
        rows[i].el.innerHTML = '<span class="p">&gt;</span> ';
        rows[i].el.append(chars.slice(0, c).join('')); rows[i].el.appendChild(cur);
        if (c >= chars.length) { i++; c = 0; later(tick, i < rows.length ? 600 : 300); } else later(tick, 34 + Math.random() * 34);
      };
      later(tick, reduce ? 0 : 2000);
    }, reduce ? 900 : 9300);
  }
  function hideFinale() {
    fz.classList.remove('on'); again2.classList.remove('on'); calbtn2.classList.remove('on'); fz.hidden = true;
    mem.classList.remove('fading'); document.body.classList.remove('finale');
    window.__bqFinale = 0;
  }
  again2.addEventListener('click', e => {
    e.stopPropagation();
    timers.forEach(clearTimeout); timers = [];
    hideFinale();
    if (window.__bqMusicAgain) window.__bqMusicAgain();
    later(() => { window.__bqPause = true; }, 2200);
    later(() => tour(0), 600);
  });
  function reset() {
    timers.forEach(clearTimeout); timers = [];
    actHide();
    hideFinale();
    started = false; window.__bqPause = false;
    mem.classList.remove('on'); pola.classList.remove('on'); top.classList.remove('on'); tiny.classList.remove('on'); calbtn.classList.remove('on'); lb.classList.remove('on'); askbtn.classList.remove('on'); ask.classList.remove('on');
    setTimeout(() => { if (!started) mem.hidden = true; }, 600);
  }
  // seulement le 1er : une petite question pour le 11 😏
  const askbtn = document.getElementById('askbtn'), ask = document.getElementById('ask'), win = document.getElementById('win');
  let answer = null;
  try { answer = localStorage.getItem('bq-rep'); if (answer) win.classList.add('answered'); } catch (e) {}
  askbtn.addEventListener('click', e => { e.stopPropagation(); ask.classList.add('on'); });
  const closeAsk = () => ask.classList.remove('on');
  document.getElementById('later').addEventListener('click', closeAsk);
  document.getElementById('x').addEventListener('click', closeAsk);
  ask.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    ask.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    answer = b.querySelector('span').textContent.trim();
    try { localStorage.setItem('bq-rep', answer); } catch (e) {}
    setTimeout(() => win.classList.add('answered'), 450);
  }));
  document.getElementById('send').addEventListener('click', async () => {
    const text = `ma réponse pour le 11 : ${answer} ♥`;
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    location.href = 'https://wa.me/?text=' + encodeURIComponent(text);
  });
  addEventListener('bq:regrow', () => { window.__bqTapped = false; reset(); });
  (function watch() {
    const st = window.__bq;
    if (st && st.opened && !started && window.__bqTapped) start(st);
    requestAnimationFrame(watch);
  })();
})();
</script>
</body>
